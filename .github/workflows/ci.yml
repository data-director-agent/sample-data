name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels the run it supersedes; each commit to main runs on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integrity:
    name: Dataset integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      # One pass over the datasets: each has scenario-card.md, crib-sheet.md and SHA256SUMS; every
      # checksum matches; and every inherited file is listed in SHA256SUMS, and nothing more.
      - name: Check each dataset's files and checksums
        run: |
          status=0
          for d in dataset-*/; do
            echo "== $d"
            for f in scenario-card.md crib-sheet.md SHA256SUMS; do
              [ -f "$d$f" ] || { echo "Missing $d$f"; status=1; }
            done
            [ -f "${d}SHA256SUMS" ] || continue
            (cd "$d" && sha256sum --quiet -c SHA256SUMS) || status=1
            diff=$(cd "$d" && comm -3 \
              <(find . -type f ! -name SHA256SUMS ! -name scenario-card.md ! -name crib-sheet.md ! -path './grant/*' ! -path './governance/*' | sed 's|^\./||' | sort) \
              <(sed -E 's/^[0-9a-f]{64}  \.\///' SHA256SUMS | sort))
            if [ -n "$diff" ]; then
              echo "Mismatch (left: on disk only, right: in SHA256SUMS only):"
              echo "$diff"
              status=1
            fi
          done
          exit $status

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16
        with:
          globs: |
            *.md
            docs/**/*.md
            dataset-*/scenario-card.md
            dataset-*/crib-sheet.md
